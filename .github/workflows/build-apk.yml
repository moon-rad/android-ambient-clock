name: Build APK

# O APK só precisa ser refeito quando muda a parte nativa (ícone, permissões, plugins).
# Mudanças visuais em src/index.html vão pelo workflow "Publicar página" e chegam ao app sozinhas.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-android.mjs'
      - 'scripts/make-icons.mjs'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Montar a pasta www (página + fontes)
        run: npm run prepare-web

      - name: Gerar o projeto Android
        run: npx cap add android

      - name: Aplicar ajustes nativos
        run: node scripts/patch-android.mjs

      - name: Gerar o ícone do app
        run: node scripts/make-icons.mjs

      - name: Sincronizar
        run: npx cap sync android

      - name: Usar a chave de assinatura fixa
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Falta o secret DEBUG_KEYSTORE_B64 (sem ele cada APK sai com assinatura diferente e não atualiza por cima)."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Nomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk relogio-ambiente.apk

      - name: Publicar como Release (para baixar direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Relógio #${{ github.run_number }}
          files: relogio-ambiente.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: relogio-ambiente-apk
          path: relogio-ambiente.apk
