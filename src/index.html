<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Relógio ambiente — protótipo</title>
<meta name="relogio-build" content="dev">
<script>
/* Atualização pela web: se esta versão (baixada do GitHub Pages) não iniciar bem em 5 s,
   descarta o download e o app volta para a versão embutida no APK. */
if(window.__fromCache){
  setTimeout(function(){
    try{
      if(window.__relogioOk){ localStorage.setItem('relogio.remote.tries','0'); }
      else { localStorage.removeItem('relogio.remote.html'); localStorage.setItem('relogio.remote.tries','0'); location.reload(); }
    }catch(e){}
  }, 5000);
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Nunito:wght@200;300&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;min-height:100vh;background:#000;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;transition:filter 1.5s;overflow:hidden}
canvas{position:absolute;left:0;top:0;display:block}
#cvAurora,#cvNight{width:100%;height:100%}
#cvAurora{filter:contrast(1.12)}   /* esmaga o cinza residual do rastro: o fundo fica 100% preto */
#batt{position:absolute;left:max(14px,2.2vw);bottom:max(12px,2.4vh);display:flex;align-items:center;gap:7px;font-size:12px;font-weight:300;letter-spacing:.04em;opacity:.45;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.6);transition:transform 3s ease}
#batt[hidden]{display:none}
#battIco{position:relative;width:20px;height:9px;border:1px solid currentColor;border-radius:2px;box-sizing:border-box}
#battIco::after{content:'';position:absolute;right:-3px;top:2px;width:2px;height:3px;background:currentColor;border-radius:0 1px 1px 0}
#battFill{position:absolute;left:1px;top:1px;bottom:1px;width:50%;background:currentColor;border-radius:1px}
body[data-scene=night] #batt{color:#ff9d57;opacity:.35;text-shadow:none}
#cvPixel{image-rendering:pixelated}
#clock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-shadow:0 2px 26px rgba(0,0,0,.35);transition:transform 3s ease}
#time{font-family:'Nunito','Inter',system-ui,sans-serif;font-size:calc(min(30vw,46vh) * var(--clk,.8));font-weight:200;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#date{font-size:13px;font-weight:300;opacity:.85;margin-top:.6em}
#wx{font-size:min(4vw,5.8vh);font-weight:300;margin-top:.7em;padding:.2em .85em;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,.28);opacity:.8;white-space:nowrap}
#wx small{opacity:.6;font-size:.7em;margin-left:.5em}
body[data-scene=night] #time{color:#ff9d57;opacity:.55;text-shadow:none}
body[data-scene=night] #date{color:#ff9d57;opacity:.4}
body[data-scene=night] #wx{color:#ff9d57;opacity:.4;border-color:rgba(255,157,87,.3)}
#hint{position:absolute;left:0;right:0;bottom:max(14px,3vh);text-align:center;font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:opacity .5s;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#hint.on{opacity:.8}
#gear{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;font-size:22px;opacity:0;transition:opacity .6s;cursor:pointer}
#gear.on{opacity:.7}
#panel{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:5}
#panel[hidden]{display:none}
.card{position:relative;width:min(92vw,440px);max-height:88vh;overflow:auto;background:rgba(24,26,38,.92);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px 20px}
.card h3{margin:14px 0 8px;font-size:13px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.card h3:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.chip.sel{background:#fff;color:#111;border-color:#fff}
.chip:disabled{opacity:.35}
input[type=range]{width:100%;margin:6px 0}
label.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px}
.close{margin-top:16px;width:100%}
#xClose{position:sticky;top:0;z-index:2;display:block;margin:-8px -10px -28px auto;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:18px;line-height:1;cursor:pointer}
#coffee{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
#coffee,#loc{margin-top:14px}
#lang{margin-top:6px}
#loc{padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
#coffeeBox,#locBox{margin-top:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:14px;line-height:1.45}
#coffeeBox[hidden],#locBox[hidden],#locStateRow[hidden]{display:none}
#locBox label{display:block;margin-top:10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
#locBox select,#locBox input{display:block;box-sizing:border-box;width:100%;margin-top:5px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;font:inherit;font-size:15px;letter-spacing:0;text-transform:none;-webkit-user-select:text;user-select:text}
#locList{margin-top:10px;display:flex;flex-direction:column;gap:6px}
#locList .chip{text-align:left;border-radius:12px}
#locMsg{margin-top:10px;font-size:13px;opacity:.7;min-height:1em}
#pixKey{display:block;margin:8px 0 10px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.35);font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;-webkit-user-select:text;user-select:text}
#powered{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;letter-spacing:.08em;opacity:.6}
#powered img{width:18px;height:18px;border-radius:50%;display:block}
#powered b{font-weight:400;opacity:1;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>

let MOON = {base:0, ev:[]};
function moonDay(date){
  const base = new Date(date.getFullYear(),date.getMonth(),date.getDate()).getTime();
  const ev = [], step = 4, H0 = .125;

  for(let t=-1440+step; t<=2880; t+=step){
    const a = moonCalc(base+t*6e4).alt;
    if((prev<H0) !== (a<H0)){

  }

}

  const ev = MOON.ev;

/* ---------- Bichos e flores lá fora (cena Janela): de vez em quando, e conforme o clima ---------- */
const WILD = {act:null, t0:0, dur:0, next:40, dir:1};
const WILD_DUR = {capivara:55, ovelhas:50, gato:36};
const FLOWERS = (()=>{ const r=rng(21), cs=[[240,120,170],[250,220,90],[240,240,250],[170,130,230]]; return Array.from({length:16},()=>({x:r(), o:Math.floor(r()*4), c:cs[Math.floor(r()*4)]})); })();
function wildPick(P){
  const k = WX.kind, day = P.d>.35;
  if(k==='storm') return null;
  const opts = [];
  if(k==='rain'){ opts.push('capivara'); }
  else { opts.push('gato','gatoJanela','gatoPula'); if(day){ opts.push('capivara'); if(k!=='fog') opts.push('ovelhas'); } }
  return opts[Math.floor(Math.random()*opts.length)];
}
function wildUpdate(P){
  if(!WILD.act){
    if(TT>=WILD.next){ const a = wildPick(P); if(a){ WILD.act=a; WILD.t0=TT; WILD.dir=Math.random()<.5?1:-1; WILD.dur=(a==='gatoJanela'||a==='gatoPula')?wcDur(a,WILD.dir):WILD_DUR[a]; } else WILD.next = TT+30; }
  } else if(TT-WILD.t0>=WILD.dur || WX.kind==='storm' || (WX.kind==='rain' && (WILD.act==='gatoJanela'||WILD.act==='gatoPula'))){ WILD.act=null; WILD.next = TT+70+Math.random()*90; }
}
function drawWild(c,P,hy,nearY,farY){
  wildUpdate(P);
  const lum = .5+.5*P.d, col = (r,g,b) => rgb([r*lum,g*lum,b*lum]);
  /* flores: abertas com sol, botões fechados com chuva ou à noite */
  const open = (WX.kind==='clear'||WX.kind==='partly') && P.d>.45;
  if(SEA==='spring'||SEA==='summer') for(const f of FLOWERS){
    const x = Math.round(f.x*PW), y = nearY(x)+1+f.o; if(y>PH-8) continue;
    c.fillStyle = col(50,120,70); c.fillRect(x,y-(open?3:2),1,open?3:2);
    c.fillStyle = col(f.c[0],f.c[1],f.c[2]);
    if(open){ c.fillRect(x-1,y-4,3,1); c.fillRect(x,y-5,1,3); c.fillStyle = col(255,220,90); c.fillRect(x,y-4,1,1); }
    else c.fillRect(x,y-3,1,1);
  }
  const A = WILD.act; if(!A) return;
  if(A==='gatoJanela'||A==='gatoPula'){ windowCat(c,P,'grass',nearY); return; }
  const t = TT-WILD.t0, u = t/WILD.dur, D = WILD.dir;
  c.globalAlpha = clamp(Math.min(1,t/2,(WILD.dur-t)/2),0,1);
  const R = (cx,cy,x,y,w,h,color) => { const X = Math.round(x*ANI), Y = Math.round(y*ANI), W = Math.max(1,Math.round(w*ANI)), H = Math.max(1,Math.round(h*ANI)); c.fillStyle = color; c.fillRect(D>0 ? Math.round(cx+X) : Math.round(cx-X-W), Math.round(cy+Y), W, H); };
  if(A==='capivara'){
    const x = D>0 ? -18+u*(PW+36) : PW+18-u*(PW+36), by = clamp(nearY(Math.round(clamp(x,0,PW-1)))+2,0,PH-9), st = Math.floor(t*3)%2;
    const body = col(160,110,70), head = col(176,126,84), dkc = col(120,80,52);
    R(x,by,0,-6,12,5,body); R(x,by,11,-7,5,5,head); R(x,by,15,-5,2,3,dkc); R(x,by,12,-8,1,1,dkc); R(x,by,14,-6,1,1,col(30,20,16));
    R(x,by,1,-1,2,2-st,dkc); R(x,by,4,-1,2,1+st,dkc); R(x,by,8,-1,2,2-st,dkc); R(x,by,10,-1,2,1+st,dkc);
  } else if(A==='ovelhas'){
    const x0 = D>0 ? PW*.26 : PW*.58;
    for(let i=0;i<3;i++){
      const x = x0+i*7+(i===1?2:0), by = Math.min(farY(Math.round(x))+7, nearY(Math.round(x))+1), hd = Math.floor(t*.7+i*1.3)%2;
      const wool = col(235,235,225), dc = col(60,52,50);
      R(x,by,0,-5,6,4,wool); R(x,by,1,-6,4,1,wool); R(x,by,6,-4+hd,2,2,dc); R(x,by,1,-1,1,2,dc); R(x,by,4,-1,1,2,dc);
    }
  } else if(A==='gato'){
    const sp = u<.4 ? u/.4*.5 : u<.6 ? .5 : .5+(u-.6)/.4*.5, sit = u>=.4 && u<.6;
    const x = D>0 ? -10+sp*(PW+20) : PW+10-sp*(PW+20), by = clamp(nearY(Math.round(clamp(x,0,PW-1)))+2,0,PH-9), fur = col(214,140,70), sw = Math.round(Math.sin(t*4));
    if(sit){ R(x,by,1,-6,4,6,fur); R(x,by,1,-9,4,3,fur); R(x,by,1,-10,1,1,fur); R(x,by,4,-10,1,1,fur); R(x,by,5,-2,3,1,fur); R(x,by,2,-8,1,1,col(150,210,90)); }
    else { const st = Math.floor(t*4)%2; R(x,by,0,-4,7,3,fur); R(x,by,6,-6,3,3,fur); R(x,by,6,-7,1,1,fur); R(x,by,8,-7,1,1,fur); R(x,by,-1+sw,-7,1,4,fur); R(x,by,1,-1,1,1+st,fur); R(x,by,5,-1,1,2-st,fur); }
  }
  c.globalAlpha = 1;
}


/* ---------- Gato na janela (cena Janela): passa pelo peitoril, olha a paisagem, pula pra grama e vai pra casinha;
              ou tenta subir, fica pendurado, cai (haha) e na segunda vez consegue ---------- */
const houseX = () => Math.min(Math.round(PW*.74), PW-27);
const ANI = .7;
const SK = 1.6;   /* escala do gato no peitoril (dentro da janela): proporcional ao vidro */
const fSK = (c,x,y,col,ox,oy,w,h) => { const x0 = Math.round(ox*SK), x1 = Math.round((ox+w)*SK), y0 = Math.round(oy*SK), y1 = Math.round((oy+h)*SK); c.fillStyle = col; c.fillRect(x+x0,y+y0,Math.max(1,x1-x0),Math.max(1,y1-y0)); };   /* escala dos bichos lá fora: pequenos perto da casa */
function wcGeom(D,act){
  const xs = Math.round(act==='gatoPula' ? PW*.26 : D>0 ? PW*.26 : PW*.7), hxd = houseX()+14, sg = hxd>xs ? 1 : -1, xj = xs+sg*10;
  return {xs, hxd, sg, xj, W: Math.abs(hxd-xj)/12};
}
const wcDur = (act,D) => (act==='gatoJanela' ? 28 : 28.5) + 3.2 + wcGeom(D,act).W + 1;
let WCL = 1;   /* luminosidade da cena, para o gato do lo-fi na grama */
function gcat(c,cx,by,D,pose,t){
  const s = .8, ox = Math.round(cx-8*s);
  if(pose==='dazed') drawCat(c,by,WCL,{act:'sitpose',t,ox,fl:D>0,s,o:{hd:1+(Math.sin(t*8)>0?1:0)}});
  else drawCat(c,by,WCL,{act:'walkpose',t:pose==='jump'?0:t,ox,fl:D>0,s});
}
/* gato visto de costas, sentado no peitoril, olhando a paisagem */
function sillBack(c,x,by,fur,fur2,t,tw,ear,squat){
  const F = (col,ox,oy,w,h) => fSK(c,x,by,col,ox,oy,w,h);   /* oy = linha de cima da peça */
  const jit = squat ? Math.round(Math.sin(t*30)) : 0;                                /* antes de pular: balança o bumbum */
  const hx = squat ? 0 : Math.round(Math.sin(t*.55)*1.0), hy = squat ? 3 : (Math.sin(t*1.7)>.55 ? 1 : 0);   /* cabeça gira devagar e respira */
  /* corpo em formato de pera: quadril largo, ombros estreitos, pescoço fino */
  F(fur,1+jit,-1,8,1); F(fur,0+jit,-5,10,4); F(fur,1+jit,-7,8,2); F(fur,2,-9,6,2); F(fur,3,-10,4,1);
  F(fur2,3,-9,1,5); F(fur2,6,-9,1,5); F(fur2,1+jit,-5,1,2); F(fur2,8+jit,-5,1,2);   /* listras das costas e do flanco */
  F(fur2,1+jit,-1,2,1); F(fur2,7+jit,-1,2,1);                                         /* patinhas de trás */
  /* cabeça + orelhas (de costas) */
  const e1 = ear===1 ? 1 : 0, e2 = ear===2 ? 1 : 0;
  F(fur,2+hx,-13+hy,6,3); F(fur2,4+hx,-13+hy,2,1);
  F(fur,2+hx,-14+hy,2,1); F(fur,6+hx,-14+hy,2,1);
  F(fur,2+hx,-15+hy+e1,1,1); F(fur,7+hx,-15+hy+e2,1,1);
  /* rabo deitado no chão, com a pontinha balançando */
  F(fur,10+jit,-2,3,2);
  for(let i=0;i<4;i++){ const off = Math.round(Math.sin(t*5-i*.8)*tw*(i+1)/4*.6); F(fur,13+off+(squat?Math.round(Math.sin(t*20)):0),-2-i,1,1); }
}
/* gato espiando por cima do peitoril (pendurado): orelhas, olhos e patinhas */
function peek(c,x,ys,t,slip,fur,fur2){
  const F = (col,ox,oy,w,h) => fSK(c,x,ys,col,ox,oy,w,h);
  const sink = Math.round(slip*7), bob = Math.round(Math.sin(t*9)*(1-slip)*1.2), w1 = Math.round(Math.sin(t*12)), eye = 'rgb(22,16,16)';
  c.save(); c.beginPath(); c.rect(x-6,ys-Math.round(14*SK),Math.round(18*SK),Math.round(14*SK)); c.clip();             /* só o que está acima do peitoril: o gato está do lado de fora */
  const hy = -6+sink+bob;
  F(fur,1,hy,1,1); F(fur,6,hy,1,1); F(fur,1,hy+1,2,1); F(fur,5,hy+1,2,1);
  F(fur,1,hy+2,6,3); F(fur2,3,hy+2,2,1);
  if(slip<.3 && t>2.5){ F(fur2,2,hy+3,2,1); F(fur2,5,hy+3,1,1); } else { F(eye,2,hy+3,1,1); F(eye,5,hy+3,1,1); }
  F(fur,3,hy+4,2,1);
  F(fur,0,-2+sink+w1,2,2); F(fur,6,-2+sink-w1,2,2);                          /* patinhas agarradas na beirada (também recortadas) */
  c.restore();
}
function windowCat(c,P,layer,nearY){
  const A = WILD.act; if(A!=='gatoJanela' && A!=='gatoPula') return;
  const t = TT-WILD.t0, D = WILD.dir, G = wcGeom(D,A), lum = .5+.5*P.d, col = (r,g,b) => rgb([r*lum,g*lum,b*lum]);
  WCL = lum; const fur = col(214,140,70), fur2 = col(160,92,42), ys = PH-6;
  const gy = x => clamp(nearY(Math.round(clamp(x,0,PW-1)))+2,0,PH-9);
  const win = (t0,a,b) => t>=t0+a && t<t0+b;
  const back = (t0,swishes,ears) => {   /* de costas olhando a paisagem */
    const tt = t-t0; let tw = .6; for(const [a,b] of swishes) if(tt>=a && tt<b) tw = 2.4;
    let ear = 0; for(const [a,b,k] of ears) if(tt>=a && tt<b) ear = k;
    if(layer==='sill') sillBack(c,G.xs-5,ys,fur,fur2,t,tw,ear);
  };
  const exit = t0 => {                    /* agacha, some do peitoril e, um tempinho depois, aparece na grama já indo pra casinha */
    const s = t-t0;
    if(s<.7){ if(layer==='sill') sillBack(c,G.xs-5,ys,fur,fur2,t,.6,0,true); return; }
    if(s<3.2 || layer!=='grass') return;
    const w = s-3.2, x = G.xj+G.sg*4+G.sg*Math.min(w*12,G.W*12), fade = Math.min(clamp(w/.4,0,1), clamp(1-(w-G.W)/1,0,1));
    c.globalAlpha = fade; gcat(c,x,gy(x),G.sg,'walk',t); c.globalAlpha = 1;
  };
  if(A==='gatoJanela'){
    if(t<6){ if(layer!=='sill') return; const u = t/6, x = (D>0 ? -14 : PW+14)+(G.xs-(D>0 ? -14 : PW+14))*u, s = 1.5;
      drawCat(c,ys,lum,{act:'walkpose',t,ox:Math.round(x-8*s),fl:D>0,s}); }
    else if(t<7){ if(layer==='sill'){ const x = G.xs; sillBack(c,x-5,ys,fur,fur2,t,.6,0); } }
    else if(t<28) back(7,[[3,5],[9,11.5],[16,18]],[[6,6.4,1],[13.5,13.9,2]]);
    else exit(28);
  } else {
    if(t<7){ if(layer==='sill'){ const tt = t, rise = 1-clamp(tt/1.2,0,1), fall = clamp((tt-4.6)/2.2,0,1); peek(c,G.xs-4,ys,tt,Math.max(rise,fall),fur,fur2); } }   /* sobe pendurado, se segura, escorrega */
    else if(t<9.5){ /* caiu: fora de vista */ }
    else if(t<13.5){ if(layer==='grass') gcat(c,G.xs,gy(G.xs),D,'dazed',t); }
    else if(t<14.7){ if(layer==='sill'){ const u = (t-13.5)/1.2, y = gy(G.xs)+(ys-gy(G.xs))*u-Math.sin(u*Math.PI)*10; gcat(c,G.xs,y,D,'jump',t); } }
    else if(t<28.5) back(14.7,[[3,5],[9,11.5]],[[7,7.4,1]]);
    else exit(28.5);
  }
}

function drawPixel(dt){
  const c = px; TT += dt;
  SEA = seasonNow();
  const m = minutesNow(), P = seaSky(phase(m),SEA), B = bodies(m), K = KINDS[WX.kind];
  const hy = Math.round(PH*.7);
  c.globalAlpha = 1;
  for(let y=0;y<hy+10;y+=3){ c.fillStyle = rgb(mixC(P.t,P.b,clamp(y/hy,0,1))); c.fillRect(0,y,PW,3); }
  // estrelas
  const sa = Math.pow(1-P.d,2)*(1-K.g*.85);
  if(sa>.02) for(const s of STARS){ c.fillStyle = `rgba(255,255,255,${sa*(.6+.4*Math.sin(TT*2+s.p))})`; c.fillRect((s.x*PW)|0,(s.y*hy*.85)|0,1,1); }
  // sol
  const skyAt = y => mixC(P.t,P.b,clamp(y/hy,0,1));
  const arcY = p => Math.round(hy-4 - Math.sin(clamp(p,0,1)*Math.PI)*hy*.78);
  const arcX = p => Math.round(PW*(.08+.84*p));
  if(B.sun!==null){
    const x=arcX(B.sun), y=arcY(B.sun), col=mixC([255,244,190],[255,140,70],P.g);
    c.fillStyle = rgb(col,.10*(1-K.g*.6)); disc(c,x,y,10);
    c.fillStyle = rgb(col,.18*(1-K.g*.6)); disc(c,x,y,7);
    c.fillStyle = rgb(col,1-K.g*.5); disc(c,x,y,5);
  }
  if(B.moon!==null) drawMoon(c, arcX(B.moon), arcY(B.moon), 5, B.psi, P, K);
  // nuvens
  const tint = mixC(mixC([66,76,118],[255,255,255],P.d),[255,196,170],P.g*.8);
  const cc = mixC(tint, mixC([70,74,86],[150,155,165],P.d), K.g);
  const n = Math.min(K.c, CLOUDS.length);
  c.fillStyle = rgb(cc, .95);
  for(let i=0;i<n;i++){
    const o=CLOUDS[i]; o.x += o.v*dt*(WX.kind==='storm'?2.2:1); if(o.x>PW+16) o.x=-18;
    const s=o.s, x=o.x|0, y=o.y|0;
    c.fillRect(x,y+2*s,11*s,3*s); c.fillRect(x+2*s,y+s,7*s,2*s); c.fillRect(x+5*s,y,4*s,2*s);
  }
  // colinas
  const farY = x => hy-4+Math.round(Math.sin(x*.045+1)*4+Math.sin(x*.11)*2);
  const nearY = x => hy+6+Math.round(Math.sin(x*.03+3)*5);
  const [far, near] = seaGround(SEA,P);
  c.fillStyle = rgb(far); for(let x=0;x<PW;x++){ const y=farY(x); c.fillRect(x,y,1,PH-y); }
  c.fillStyle = rgb(near); for(let x=0;x<PW;x++){ const y=nearY(x); c.fillRect(x,y,1,PH-y); }
  // casinha (parede, telhado triangular, porta, janela acesa à noite e chaminé)
  const hx = houseX(), by = nearY(hx)+3, wall = mixC([28,26,40],[176,140,112],P.d); let roof = mixC([30,18,24],[140,60,50],P.d); if(SEA==='winter') roof = mixC(roof,mixC([150,160,190],[240,244,252],P.d),.8);
  c.fillStyle = rgb(wall); c.fillRect(hx,by-12,20,12);
  c.fillStyle = rgb(roof); for(let r=0;r<=9;r++) c.fillRect(hx-2+r,by-13-r,24-2*r,1);
  c.fillStyle = rgb(mixC(roof,[0,0,0],.2)); c.fillRect(hx+14,by-24,3,9);
  c.fillStyle = rgb(mixC([20,14,18],[96,60,44],P.d)); c.fillRect(hx+13,by-8,4,8);
  c.fillStyle = rgb(mixC([250,210,110],[60,40,30],P.d*.8)); c.fillRect(hx+16,by-4,1,1);
  c.fillStyle = P.d<.5 ? 'rgb(255,205,110)' : rgb(mixC([150,190,220],[176,200,220],P.d)); c.fillRect(hx+3,by-9,5,5);
  c.fillStyle = rgb(mixC(wall,[0,0,0],.45)); c.fillRect(hx+5,by-9,1,5); c.fillRect(hx+3,by-7,5,1);
  if(xmasOn()){      /* pisca-pisca no telhado e no beiral */
    const cols = [[255,70,70],[255,214,80],[90,210,130],[100,160,255]], pts = [];
    for(let r=0;r<=8;r+=2) pts.push([hx-2+r,by-13-r],[hx+21-r,by-13-r]);
    for(let x=hx+1;x<hx+20;x+=3) pts.push([x,by-12]);
    pts.forEach((q,i)=>{ const lit = Math.floor(TT*1.6+i*.5)%2===0, col = cols[i%4];
      if(lit && P.d<.65){ c.fillStyle = rgb(col,.2*(1-P.d)); c.fillRect(q[0]-1,q[1]-1,3,3); }
      c.fillStyle = rgb(col, lit ? 1 : .3); c.fillRect(q[0],q[1],1,1); });
  }
  if(P.d<.6 || WX.temp<20) for(let i=0;i<3;i++){ const ph=(TT*3+i*3.1)%9; c.fillStyle=`rgba(230,230,240,${(1-ph/9)*.45})`; c.fillRect(hx+15+Math.round(Math.sin(TT+i*2)*1.2)+(ph>4?1:0),Math.round(by-25-ph),1,1); }
  { const tx = Math.round(PW*.12); drawTree(c,SEA,P,tx,nearY(tx)+3,9,16); }
  drawWild(c,P,hy,nearY,farY);
  drawSeasonParts(c,SEA,P,dt,0,0,PW,PH-6);
  // chuva
  if(WX.kind==='rain'||WX.kind==='storm'){
    c.fillStyle='rgba(190,210,255,.55)';
    for(const d of DROPS){ d.y+=d.v*dt; d.x+=dt*14; if(d.y>PH){d.y=-3; d.x=Math.random()*PW;} if(d.x>PW) d.x=0; c.fillRect(d.x|0,d.y|0,1,3); }
  }
  if(WX.kind==='storm'){ if(Math.random()<.02) FLASH=1; if(FLASH>.05){ c.fillStyle=`rgba(255,255,255,${FLASH*.45})`; c.fillRect(0,0,PW,PH); FLASH*=.78; } }
  if(WX.kind==='fog'){ c.fillStyle='rgba(205,210,220,.30)'; c.fillRect(0,0,PW,PH); c.fillStyle='rgba(205,210,220,.18)'; c.fillRect(0,hy-14,PW,PH); }
  // moldura da janela
  const dk='rgb(66,42,26)', lt='rgb(118,78,48)';
  c.fillStyle=dk; c.fillRect(0,0,PW,3); c.fillRect(0,0,3,PH); c.fillRect(PW-3,0,3,PH);
  c.fillStyle=lt; c.fillRect(3,3,PW-6,1); c.fillRect(3,3,1,PH-9); c.fillRect(PW-4,3,1,PH-9);
  const mx=Math.round(PW/2); c.fillStyle=dk; c.fillRect(mx-1,0,2,PH-6); c.fillRect(0,Math.round(hy*.58),PW,2);
  c.fillStyle=lt; c.fillRect(mx-1,3,1,PH-9);
  c.fillStyle=dk; c.fillRect(0,PH-6,PW,6); c.fillStyle='rgb(150,104,66)'; c.fillRect(0,PH-6,PW,1);
  // vasinho no parapeito
  c.fillStyle='rgb(176,92,62)'; c.fillRect(10,PH-11,7,5); c.fillRect(9,PH-12,9,2);
  c.fillStyle='rgb(60,130,80)'; c.fillRect(13,PH-17,1,5); c.fillRect(11,PH-16,2,2); c.fillRect(15,PH-15,2,2); c.fillRect(12,PH-19,3,2);
  if(SEA==='winter'){ c.fillStyle='rgba(245,248,255,.92)'; c.fillRect(0,PH-7,PW,1); }   // neve no peitoril
  windowCat(c,P,'sill',nearY);
}

/* ---------- Cena: Lo-fi (quartinho aconchegante) ---------- */
const dk = (c,f) => [c[0]*f, c[1]*f, c[2]*f];
/* ---------- Gatinho: dorme, mas de vez em quando faz alguma coisa ---------- */
const CAT = {act:'sleep', t0:0, dur:0, next:20, caught:false};
const CAT_DUR = {tail:3.5, ear:1.4, eye:4.5, bocejo:2.6, stretch:4.5, sentar:34, mosca:18.5, walk:31};
const CAT_MUG = 31;   /* onde o gato para ao lado da caneca (x da frente do corpo) */
const catWalkOK = () => PW-40-CAT_MUG >= 10;   /* sem espaço na mesa (tela estreita): não passeia */
function catPick(){
  const m = minutesNow(), wet = WX.kind==='rain'||WX.kind==='storm', calm = m<330;
  const w = {tail:16, ear:10, eye:wet?18:5, bocejo:calm?10:8, stretch:calm?8:16, sentar:wet?26:calm?4:16, mosca:(wet||calm)?2:10, walk:calm?3:10};
  if(!catWalkOK()){ w.walk = 0; }
  let r = Math.random()*Object.values(w).reduce((a,b)=>a+b,0);
  for(const k in w){ r -= w[k]; if(r<=0) return k; }
  return 'tail';
}
function catStart(act){ CAT.act = act; CAT.t0 = TT; CAT.dur = CAT_DUR[act]||0; if(act==='mosca') CAT.caught = Math.random()<.45; }
function catUpdate(){
  if(CAT.act==='sleep'){ if(TT>=CAT.next) catStart(catPick()); }
  else if(TT-CAT.t0>=CAT.dur){
    if(CAT.act==='sentar' && catWalkOK() && Math.random()<.7){ catStart('walk'); return; }   /* depois de sentar, vai até a caneca */
    CAT.act='sleep'; CAT.next = TT + (minutesNow()<330 ? 100+Math.random()*120 : 40+Math.random()*80);
  }
}
const blinkAt = (t,period,off) => (t+off)%period > period-.16;   /* pisca por 0,16 s a cada "period" segundos */
function drawCat(c,dy,lum,ov){   /* ov: desenha o MESMO gato do lo-fi em outras cenas {act,t,ox,fl,s,o,dur} */
  if(!ov) catUpdate();
  const a = ov ? ov.act : CAT.act, t = ov ? ov.t : TT-CAT.t0, cx0 = ov ? ov.ox : PW-40, S = ov ? (ov.s||1) : 1, DUR = ov ? (ov.dur||30) : CAT.dur;
  const fur = rgb(dk([214,140,70],lum)), fur2 = rgb(dk([160,92,42],lum)), nose = rgb(dk([60,36,30],lum)), bib = rgb(dk([238,210,170],lum));
  const eyeC = 'rgb(22,16,16)', pink = rgb(dk([240,150,160],lum)), tongueC = rgb(dk([236,96,124],lum));   /* olhos: pontinhos pretos */
  let ox = cx0, fl = ov ? !!ov.fl : false;
  const F = (col,x,y,w,h) => { const q = fl ? 16-x-w : x; c.fillStyle = col;
    if(S===1){ c.fillRect(ox+q,y,w,h); return; }
    const x0 = Math.round(q*S), x1 = Math.round((q+w)*S), y0 = Math.round((y-dy)*S), y1 = Math.round((y-dy+h)*S);
    c.fillRect(ox+x0,dy+y0,Math.max(1,x1-x0),Math.max(1,y1-y0)); };
  /* gato sentado (de lado, virado para a esquerda).
     o: hd cabeça (0 alta … 4 baixa), closed olhos fechados, tongue língua, paw pata no rosto (pawUp sobe/desce),
        swat pata esticada (0..1), lift pulo, ta/tw amplitude e velocidade do rabo */
  const sit = o => {
    const y = dy-(o.lift||0), hd = o.hd===undefined ? 1 : o.hd, hy = y-16+hd, ta = o.ta===undefined ? 1 : o.ta, tw = o.tw||2.2;
    F(fur,4,y-7,5,1); F(fur,3,y-6,7,5); F(fur,3,y-1,7,1);          /* anca redonda */
    F(fur,2,y-11,5,6); F(bib,2,y-10,2,5);                            /* peito claro */
    if(!o.paw){ F(fur,1,y-6,2,6); F(bib,0,y-1,3,1); }                /* perna da frente */
    F(fur,0,hy,6,5); F(fur,0,hy-2,1,2); F(fur,4,hy-2,1,2); F(fur2,2,hy,2,1);   /* cabeça, orelhas, listra */
    F(pink,2,hy+3,2,1);                                              /* nariz/boca */
    if(o.closed){ F(fur2,1,hy+2,1,1); F(fur2,4,hy+2,1,1); } else { F(eyeC,1,hy+2,1,1); F(eyeC,4,hy+2,1,1); }
    if(o.tongue) F(tongueC,2,hy+4,2,1);
    F(fur2,6,y-10,1,3); F(fur2,7,y-5,1,3);
    F(fur,10,y-3,3,2);                                                /* rabo: sobe balançando */
    for(let i=0;i<5;i++){ const off = Math.round(Math.sin(t*tw-i*.9)*ta*(i+1)/5); F(fur,12+off,y-4-i,i<3?2:1,1); }
    if(o.paw){ const up = o.pawUp||0; F(fur,-1,hy+3+up,2,3); F(bib,-1,hy+3+up,2,1); F(fur,-1,y-1,3,1); }
    if(o.swat>0){ const e = o.swat, L = Math.round(4*e)+2, hh = hy+1-Math.round(2*e); F(fur,-1-Math.round(4*e),hh,L,2); F(bib,-1-Math.round(4*e),hh,1,2); }
  };
  const walkS = (st,sw) => {
    F(fur,3,dy-9,12,4);
    F(fur,3,dy-5,2,5-st); F(fur,6,dy-5,2,4+st); F(fur,11,dy-5,2,4+st); F(fur,14,dy-5,2,5-st);
    F(fur2,6,dy-9,1,4); F(fur2,10,dy-9,1,4);
    F(fur,-2,dy-11,5,5); F(fur,-2,dy-13,1,2); F(fur,2,dy-13,1,2);
    F(eyeC,-1,dy-9,1,1); F(eyeC,1,dy-9,1,1); F(pink,-2,dy-8,1,1);
    F(fur,15,dy-10,2,2); F(fur,16+sw,dy-17,1,8); F(fur2,16+sw+1,dy-18,1,1);   /* rabo erguido */
  };
  let zzz = false;
  if(a==='sitpose'){ sit(ov.o||{}); }
  else if(a==='walkpose'){ walkS(Math.floor(t*6)%2, Math.round(Math.sin(t*3))); }
  else if(a==='stretch'){
    const e = Math.min(1, Math.sin(Math.PI*clamp(t/DUR,0,1))*1.6);
    const k = Math.round(3*e), k2 = Math.round(e), up = Math.round(4*e), fh = 5-Math.round(2*e);
    F(fur,0,dy-fh,7,fh); F(fur,7,dy-5-up,7,5+up);
    F(fur,-3-k,dy-6+k2,5,5-k2); F(fur,-3-k,dy-8+k2,1,2); F(fur,1-k,dy-8+k2,1,2);
    F(fur,14,dy-3-Math.round(3*e),3,2); F(fur,16,dy-5-Math.round(5*e),1,3);
    F(nose,-2-k,dy-4+k2,2,1);
    if(e>.5){ F(fur2,-3-k,dy-4+k2,2,1); }   /* olhinho apertado */
  } else if(a==='sentar'){
    ox = cx0+2;
    const blink = blinkAt(t,4.3,0) || blinkAt(t,7.1,1.9);
    if(t<7)       sit({hd:1, closed:blink, ta:1, tw:1.6});                                    /* sentadinho, piscando */
    else if(t<12) sit({hd:0, closed:blink, ta:1.2, tw:2});                                    /* olha pela janela */
    else if(t<14) sit({hd:2, paw:true, pawUp:0, tongue:Math.floor(t*5)%2===0, closed:true});  /* lambe a patinha */
    else if(t<20) sit({hd:1+(Math.sin(t*6)>0?1:0), paw:true, pawUp:Math.round(Math.sin(t*6)), closed:true});  /* lava o rosto */
    else if(t<25) sit({hd:4, tongue:Math.floor(t*4)%2===0, closed:true});                     /* lambe o peito */
    else if(t<30) sit({hd:1, closed:blink, ta:2.4, tw:6});                                    /* balança o rabo */
    else          sit({hd:1+(Math.floor(t*.8)%2), closed:blinkAt(t,3,.5), ta:.8, tw:1.4});   /* acomoda */
  } else if(a==='mosca'){
    ox = cx0+2;
    /* a mosca: entra voando, rodeia o gato; ele acompanha com a cabeça, dá patadas e (às vezes) pega */
    let fx, fy, vis = true;
    if(t<3.5){ const u = t/3.5; fx = cx0-60+48*u; fy = dy-26+Math.sin(t*6)*3-4*Math.sin(u*Math.PI); }
    else if(t<11 || (!CAT.caught && t<11)){ fx = cx0-12+9*Math.sin(t*2.1)+3*Math.sin(t*6.7); fy = dy-24+6*Math.sin(t*2.9+1)+2*Math.sin(t*9); }
    else { const ex = cx0-12+9*Math.sin(11*2.1)+3*Math.sin(11*6.7), ey = dy-24+6*Math.sin(11*2.9+1)+2*Math.sin(11*9); fx = ex-(t-11)*18; fy = ey-(t-11)*3; }
    if(CAT.caught && t>=10.1) vis = false;
    if(fx<-4 || fx>PW) vis = false;
    const sw1 = t>=6.4 && t<7.0 ? Math.sin((t-6.4)/.6*Math.PI) : 0, sw2 = t>=9.5 && t<10.1 ? Math.sin((t-9.5)/.6*Math.PI) : 0, sw = Math.max(sw1,sw2);
    const blink = blinkAt(t,4.3,0);
    if(t<3.2)        sit({hd:fy<dy-26?0:1, closed:blink, ta:1, tw:2});
    else if(t<10.1)  sit({hd:fy<dy-27?0:fy>dy-21?2:1, closed:false, ta:2.2, tw:9, swat:sw, lift:Math.round(3*sw)});
    else if(CAT.caught){
      if(t<13)       sit({hd:3, paw:true, pawUp:0, tongue:Math.floor(t*5)%2===0, closed:false, ta:1.5, tw:5});      /* olha e lambe a patinha */
      else           sit({hd:1+(Math.sin(t*6)>0?1:0), paw:true, pawUp:Math.round(Math.sin(t*6)), closed:true});     /* lava o rosto */
    } else {
      if(t<15)       sit({hd:fy<dy-27?0:1, closed:false, ta:2.4, tw:8});
      else           sit({hd:1, closed:blinkAt(t,3,.5), ta:.8, tw:1.4});
    }
    if(vis){
      const light = lum<.78, fyr = Math.round(fy), fxr = Math.round(fx);
      c.fillStyle = light ? 'rgb(235,235,246)' : 'rgb(24,20,20)'; c.fillRect(fxr,fyr,2,1);
      c.fillStyle = light ? 'rgba(235,235,246,.7)' : 'rgba(60,60,70,.7)'; c.fillRect(fxr+(Math.floor(TT*30)%2),fyr-1,1,1);
    }
  } else if(a==='walk'){
    const D = cx0-CAT_MUG; let p = 0, moving = false, mode = 'walk';
    if(t<11){ p = t/11; moving = true; }
    else if(t<19){ p = 1; mode = 'sit'; }
    else if(t<30){ p = 1-(t-19)/11; moving = true; fl = true; }
    ox = cx0 - Math.round(p*D);
    if(mode==='sit'){
      sit({hd:Math.floor(t*.8)%2===0 ? 2 : 1, closed:blinkAt(t,4.3,.7), ta:1.2, tw:3});
    } else {
      walkS(moving ? Math.floor(t*6)%2 : 0, Math.round(Math.sin(t*3)));
    }
  } else {
    const br = Math.round((Math.sin(TT*1.7)+1)/2);
    F(fur,0,dy-5,14,5); F(fur,1,dy-6-br,12,1+br);
    F(fur,-3,dy-6,5,5);
    let earL = 2; if(a==='ear' && Math.floor(t*8)%2===0) earL = 1;
    F(fur,-3,dy-6-earL,1,earL); F(fur,1,dy-8,1,2);
    if(a==='ear' && Math.floor(t*8)%2===1) F(fur,1,dy-9,1,1);
    F(fur,14,dy-3,3,2);
    const ty = a==='tail' ? Math.round(Math.sin(t*7)*1.6) : 0;
    F(fur,16,dy-5+ty,1,3); if(ty!==0) F(fur,17,dy-4+ty,1,2);
    F(fur2,4,dy-6-br,1,2+br); F(fur2,8,dy-6-br,1,2+br);
    if(a==='bocejo' && t>.3 && t<DUR-.3){ F('rgb(190,70,90)',-3,dy-4,2,2); }   /* boca aberta */
    else { F(nose,-2,dy-4,2,1); }
    if(a==='eye' && t>.5 && t<DUR-.9){ F(eyeC,-2,dy-5,1,1); }
    else if(a!=='bocejo') zzz = true;
  }
  if(zzz){
    const zt = (TT*1.6)%6;
    c.fillStyle = `rgba(255,255,255,${.75*(1-zt/6)})`;
    const zx = Math.round(cx0-4+zt*.8), zy = Math.round(dy-11-zt*1.6);
    c.fillRect(zx,zy,3,1); c.fillRect(zx+1,zy+1,1,1); c.fillRect(zx,zy+2,3,1);
  }
}

/* ---------- Passarinhos no céu do Lo-fi (só de dia e sem chuva) ---------- */
const BIRDS = {list:[], next:14};
function birdsTick(dt,P){
  if(TT>=BIRDS.next){
    if(P.d>.4 && WX.kind!=='rain' && WX.kind!=='storm' && WX.kind!=='fog'){
      const n = 1+Math.floor(Math.random()*3), dir = Math.random()<.5?1:-1, y = .06+Math.random()*.28, sp = 9+Math.random()*7;
      for(let i=0;i<n;i++) BIRDS.list.push({u:-.06-i*.07, dir, y:y+(i%2?.03:-.02)*i, sp, ph:Math.random()*6});
      BIRDS.next = TT+35+Math.random()*60;
    } else BIRDS.next = TT+20;
  }
}

function drawLofi(dt){

  { const bc = P.d>.4 ? 'rgb(34,34,46)' : 'rgb(20,22,34)';

  c.fillStyle = rgb(wood); c.fillRect(x0-6,y0-4,ww+12,2);

/* ---------- Cena: Noturno (céu estrelado dinâmico) ---------- */
const cvNight = $('cvNight'), nc = cvNight.getContext('2d');
let NDPR = 1, NSTARS = [], NT = 0, SHOOT = null, nextShoot = 12, NEB = null, NEBR = 0;
function sizeNight(){
  NDPR = Math.min(devicePixelRatio||1, 2);
  cvNight.width = Math.round(innerWidth*NDPR); cvNight.height = Math.round(innerHeight*NDPR);
  const R = Math.hypot(cvNight.width,cvNight.height)/2, r = rng(11);
  const n = Math.round(innerWidth*innerHeight/1500);
  NSTARS = Array.from({length:n},()=>{
    const big = r()>.85;
    return { d: Math.sqrt(r())*R, a: r()*Math.PI*2, r: (big ? 1.9 : .8+r()*.7)*NDPR, sp: .35+r()*.75, ph: r()*6.28, k: r(), mx: .65+r()*.35 };
  });

  NEBR = R; const S = Math.ceil(R), cv = document.createElement('canvas'); cv.width = cv.height = S; const g = cv.getContext('2d'), k = S/(2*R), rr = rng(23);
  const cols = [[120,90,200],[70,120,210],[190,90,160],[90,170,200],[150,110,220]];
  for(let i=0;i<7;i++){ const ang = rr()*Math.PI*2, dist = (.15+rr()*.75)*R, x = (R+Math.cos(ang)*dist)*k, y = (R+Math.sin(ang)*dist)*k, rad = (.28+rr()*.35)*R*k, col = cols[i%cols.length], a = .05+rr()*.05;
    const gr = g.createRadialGradient(x,y,0,x,y,rad); gr.addColorStop(0,`rgba(${col},${a.toFixed(3)})`); gr.addColorStop(1,`rgba(${col},0)`); g.fillStyle = gr; g.fillRect(0,0,S,S); }
  NEB = cv;
}
function drawNight(dt){
  NT += dt;
  const c = nc, W = cvNight.width, H = cvNight.height, cx = W/2, cy = H/2;
  c.fillStyle = '#02030a'; c.fillRect(0,0,W,H);
  const rot = NT*.010; /* o céu gira bem devagar (uma volta a cada ~10 min); o centro um pouco mais rápido que a borda, como uma galáxia */
  if(NEB){ c.save(); c.translate(cx,cy); c.rotate(rot*.9); c.drawImage(NEB,-NEBR,-NEBR,2*NEBR,2*NEBR); c.restore(); }
  for(const s of NSTARS){
    const ang = s.a+rot*(1.25-.5*Math.min(1,s.d/NEBR)), x = cx+Math.cos(ang)*s.d, y = cy+Math.sin(ang)*s.d;
    if(x<-6||y<-6||x>W+6||y>H+6) continue;
    const t = .5+.5*Math.sin(s.ph+NT*s.sp);          /* acende e apaga suavemente */
    const al = Math.pow(t,2)*s.mx+.06;
    const col = s.k<.2 ? '255,214,170' : s.k>.75 ? '176,200,255' : '240,244,255';
    c.fillStyle = `rgba(${col},${al.toFixed(3)})`;
    c.beginPath(); c.arc(x,y,s.r,0,6.283); c.fill();
    if(al>.6 && s.r>1.1*NDPR){ c.fillStyle = `rgba(${col},${(al*.14).toFixed(3)})`; c.beginPath(); c.arc(x,y,s.r*3.4,0,6.283); c.fill(); }
  }
  /* estrela cadente, rara */
  nextShoot -= dt;
  if(!SHOOT && nextShoot<=0){
    const a = (.15+Math.random()*.35)*Math.PI;
    SHOOT = { x:Math.random()*W*.8+W*.1, y:Math.random()*H*.4, vx:Math.cos(a)*W*.9*(Math.random()<.5?1:-1), vy:Math.sin(a)*W*.5, t:0, i:.45+Math.random()*.55 };
    nextShoot = 18+Math.random()*27;
  }
  if(SHOOT){
    SHOOT.t += dt; const T = .9;
    if(SHOOT.t>T){ SHOOT = null; }
    else {
      const p = SHOOT.t/T, x = SHOOT.x+SHOOT.vx*p*.4, y = SHOOT.y+SHOOT.vy*p*.4, fade = Math.sin(p*Math.PI);

}

/* ---------- Relógio ---------- */
let lastDate = '';
function tickClock(){
  const d = new Date();
  if(d.getDate()!==stDay){ stDay=d.getDate(); ST=sunTimes(d); MOON=moonDay(d); }
  let H,M;
  if(SIM!==null){ H=Math.floor(SIM/60); M=Math.floor(SIM%60); } else { H=d.getHours(); M=d.getMinutes(); }
  $('hh').textContent = String(H).padStart(2,'0');
  $('mm').textContent = String(M).padStart(2,'0');
  $('col').style.opacity = (d.getSeconds()%2===0) ? 1 : .25;
  const ds = d.toLocaleDateString(tr('dateLoc'),{weekday:'long',day:'numeric',month:'long'});
  if(ds!==lastDate){ lastDate=ds; $('date').textContent = ds.charAt(0).toUpperCase()+ds.slice(1); }
  const late = (H*60+M)>=23*60 || (H*60+M)<6*60;
  let br = ($('dim').checked && late) ? .5 : 1;
  if(LUX!==null && $('lux').checked) br = Math.min(br, clamp(.35+Math.log10(1+LUX)*.22,.35,1));
  $('stage').style.filter = br<1 ? `brightness(${br.toFixed(2)})` : 'none';
}

  }
}catch(e){}

function fillCountries(){
  let nm; try{ nm = new Intl.DisplayNames([tr('dateLoc')],{type:'region'}); }catch(e){ nm = {of:c=>c}; }
  const list = CC.map(c => { let n = c; try{ n = nm.of(c)||c; }catch(e){} return [c,n]; }).sort((a,b)=>a[1].localeCompare(b[1],LANG));
  const sel = $('locCountry'); sel.textContent = ''; for(const [c,n] of list){ const o = document.createElement('option'); o.value = c; o.textContent = n; sel.appendChild(o); }
  sel.value = locCC;
}
fillCountries();
const locMsg = t => { $('locMsg').textContent = t; };
function setLoc(l){
  CFG.lat = l.lat; CFG.lon = l.lon; CFG.city = l.name; CFG.gps = !!l.gps;
  try{ localStorage.setItem('relogio.loc', JSON.stringify(l)); }catch(e){}
  $('locName').textContent = cityName();
  stDay = -1; tickClock();          /* recalcula nascer/pôr do sol e lua para o novo lugar */
  loadWeather();
}
$('locName').textContent = cityName();
$('locBtn').onclick = () => { const b = $('locBox'); b.hidden = !b.hidden; $('locBtn').setAttribute('aria-expanded', String(!b.hidden)); };
function useGps(silent){
  if(!navigator.geolocation){ if(!silent) locMsg(tr('gpsNone')); return; }
  if(!silent) locMsg(tr('gpsSearch'));
  navigator.geolocation.getCurrentPosition(
    p => { setLoc({lat:+p.coords.latitude.toFixed(2), lon:+p.coords.longitude.toFixed(2), name:'Minha localização', gps:true}); if(!silent) locMsg(tr('gpsOk')); },
    err => { if(!silent) locMsg(err && err.code===1 ? tr('gpsDenied') : tr('gpsFail')); },
    {timeout:15000, maximumAge:3600e3}
  );
}
$('locGps').onclick = () => useGps(false);
/* se já usava GPS e a permissão já foi dada, atualiza o lugar ao abrir (sem pedir de novo) */
try{ const s = JSON.parse(localStorage.getItem('relogio.loc')||'null');
  if(s && s.gps && navigator.permissions && navigator.permissions.query) navigator.permissions.query({name:'geolocation'}).then(r => { if(r.state==='granted') useGps(true); }).catch(()=>{}); }catch(e){}
let locTimer = null, locRes = [];
function locRender(){
  const st = $('locState').value, list = locRes.filter(r => !st || r.admin1===st).slice(0,8);
  const box = $('locList'); box.textContent = '';
  for(const r of list){
    const b = document.createElement('button'); b.className = 'chip';
    b.textContent = r.name + (r.admin1 ? ' — '+r.admin1 : '');
    b.onclick = () => { setLoc({lat:+(+r.latitude).toFixed(3), lon:+(+r.longitude).toFixed(3), name:r.name+(r.admin1?', '+r.admin1:''), cc:r.country_code||locCC}); box.textContent = ''; locMsg(tr('picked')+r.name+'.'); };
    box.appendChild(b);
  }
  if(!list.length && $('locQuery').value.trim().length>=2) locMsg(tr('noCity'));
}
async function locSearch(){
  const q = $('locQuery').value.trim();
  if(q.length<2){ locRes = []; $('locStateRow').hidden = true; $('locList').textContent = ''; locMsg(''); return; }
  locMsg(tr('searching'));
  try{
    const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=50&language='+T[LANG].geoLang+'&format=json&countryCode='+locCC);
    if(!r.ok) throw new Error('http');
    const j = await r.json(); locRes = j.results || [];
    const states = [...new Set(locRes.map(x => x.admin1).filter(Boolean))].sort((a,b)=>a.localeCompare(b,LANG));
    const sel = $('locState'); sel.textContent = '';
    const all = document.createElement('option'); all.value = ''; all.textContent = tr('allStates'); sel.appendChild(all);
    for(const s of states){ const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); }
    $('locStateRow').hidden = states.length<2;
    locMsg(''); locRender();
  }catch(e){ locMsg(tr('offline')); }
}
$('locQuery').oninput = () => { clearTimeout(locTimer); locTimer = setTimeout(locSearch, 400); };
$('locState').onchange = locRender;
$('locCountry').onchange = () => { locCC = $('locCountry').value; locSearch(); };
$('close').onclick = e => { e.stopPropagation(); $('panel').hidden = true; };
$('xClose').onclick = e => { e.stopPropagation(); $('panel').hidden = true; };
$('coffeeBtn').onclick = () => { const b = $('coffeeBox'); b.hidden = !b.hidden; $('coffeeBtn').setAttribute('aria-expanded', String(!b.hidden)); };
$('pixCopy').onclick = async () => {
  const key = $('pixKey').textContent.trim(); let ok = false;
  try{ await navigator.clipboard.writeText(key); ok = true; }catch(e){}
  if(!ok){
    try{ const ta = document.createElement('textarea'); ta.value = key; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); }catch(e){}
  }
  $('pixCopy').textContent = ok ? tr('copied') : tr('copyFail');
  setTimeout(()=>{ $('pixCopy').textContent = tr('pixCopy'); }, 2500);
};
$('panel').onclick = e => { e.stopPropagation(); if(e.target===$('panel')) $('panel').hidden = true; };

let first = true;
$('stage').addEventListener('click', e => {
  if(!$('panel').hidden || e.target.id==='gear' || (e.target.closest && e.target.closest('#panel'))) return;   /* clicar para fechar o menu não troca de cena */
  if(first){ first=false;
    if(!window.RelogioNative){ try{ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{}); }catch(_){} }
    try{ navigator.wakeLock && navigator.wakeLock.request('screen').catch(()=>{}); }catch(_){}
  }
  const L = sceneList(), i = L.indexOf(scene);
  setScene(L[(i+1)%L.length], true); showGear();
});

/* anti-burn-in: desloca o relógio alguns pixels a cada minuto */
setInterval(()=>{ const t = `translate(${Math.round((Math.random()-.5)*16)}px,${Math.round((Math.random()-.5)*16)}px)`; $('clock').style.transform = t; $('batt').style.transform = t; }, 60000);

/* ---------- Loop ---------- */
let last = performance.now(), accP = 0, accA = 0, accN = 0, accC = 0;
function frame(ts){
  const dt = Math.min(.1,(ts-last)/1000); last = ts;
  accC += dt; if(accC>=.5){ accC=0; tickClock(); }
  if(XSCENES.includes(scene) && !xmasOn()) setScene('window',false);
  if(scene==='window'||scene==='lofi'||scene==='sala'||scene==='vila'){ accP += dt; if(accP>=1/12){ ({window:drawPixel,lofi:drawLofi,sala:drawSala,vila:drawVila})[scene](accP); accP=0; } }
  else if(scene==='aurora'){ accA += dt; if(accA>=1/30){ drawAurora(accA); accA=0; } }
  else if(scene==='night'){ accN += dt; if(accN>=1/24){ drawNight(accN); accN=0; } }
  requestAnimationFrame(frame);
}
function resize(){ sizePixel(); sizeAurora(); sizeNight(); }
/* tamanho do relógio (guardado no aparelho) */
function setClk(v){ document.documentElement.style.setProperty('--clk', v/100); $('clkLbl').textContent = `(${v}%)`; try{ localStorage.setItem('clk', v); }catch(e){} }
$('clk').oninput = e => setClk(+e.target.value);
try{ const v = +localStorage.getItem('clk'); if(v>=50 && v<=140){ $('clk').value = v; setClk(v); } }catch(e){}
addEventListener('resize', resize);

/* aplica o idioma a todos os textos da tela */
function ft(el, txt){ if(!el) return; const n = [...el.childNodes].find(x => x.nodeType===3 && x.nodeValue.trim()!==''); if(n) n.nodeValue = n.nodeValue.match(/^\s*/)[0] + txt + n.nodeValue.match(/\s*$/)[0]; }
function applyLang(){
  document.documentElement.lang = tr('dateLoc'); document.title = tr('title');
  $('gear').setAttribute('aria-label', tr('settings')); $('xClose').setAttribute('aria-label', tr('close'));
  const h = document.querySelectorAll('#panel h3'); [tr('scene'), tr('clock'), tr('test'), tr('weather')].forEach((t,i)=>ft(h[i], t));
  $('simNow').textContent = tr('realTime'); ft($('dim').parentNode, tr('dim')); $('luxLbl').textContent = tr(luxKey);
  ft($('locBtn'), tr('locBtn')); $('locGps').textContent = tr('gps'); $('locName').textContent = cityName();
  ft($('locCountry').parentNode, tr('country')); ft($('locQuery').parentNode, tr('city')); $('locQuery').placeholder = tr('cityPh'); ft($('locStateRow'), tr('state'));
  $('langH').textContent = tr('language');
  $('coffeeBtn').textContent = tr('coffeeBtn'); ft($('coffeeBox'), tr('coffeeTxt')); $('pixCopy').textContent = tr('pixCopy');
  const nt = [...$('coffeeBox').querySelectorAll('div')].pop(); if(nt) nt.textContent = tr('pixNote');
  $('close').textContent = tr('close');
  if(SIM===null) $('simLbl').textContent = '('+tr('real')+')';
  $('seaH').textContent = tr('season'); buildSeaChips(); $('xmasH').textContent = tr('xmas'); buildXmasChips();
  fillCountries(); buildChips(); setScene(scene,false); updateWx(); lastDate = ''; tickClock();
  document.querySelectorAll('#rowLang .chip').forEach(b => b.classList.toggle('sel', b.dataset.l===LANGPREF));
  $('locList').textContent = ''; $('locMsg').textContent = '';
}
[['auto','Auto'],['pt','Português'],['en','English']].forEach(([k,n])=>{ const b=document.createElement('button'); b.className='chip'; b.dataset.l=k; b.textContent=n;
  b.onclick = () => { LANGPREF = k; try{ localStorage.setItem('relogio.lang', k); }catch(e){} resolveLang(); applyLang(); if(!WX.live) {} else loadWeather(); };
  $('rowLang').appendChild(b); });
resize(); applyLang(); showGear();
loadWeather(); setInterval(loadWeather, 15*60*1000); setInterval(()=>{ if(!WX.live) loadWeather(); }, 2*60*1000); /* sem dados reais? tenta de novo a cada 2 min */
requestAnimationFrame(frame);
readBatt(); setInterval(readBatt, 30000);
window.__relogioOk = true; /* sinal de que a página iniciou sem erros */

/* ---------- Atualização pela web (só no app) ---------- */
const REMOTE_URL = 'https://moon-rad.github.io/android-ambient-clock/index.html';
async function checkUpdate(){
  if(!IS_NATIVE) return;
  try{
    const r = await fetch(REMOTE_URL+'?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const t = await r.text();
    const rv = (t.match(/name="relogio-build" content="([^"]+)"/)||[])[1];
    const cur = (document.querySelector('meta[name="relogio-build"]')||{}).content;
    if(!rv || !cur || t.length<5000 || !t.includes('__relogioOk') || !(rv>cur)) return;
    localStorage.setItem('relogio.remote.html', t);
    localStorage.setItem('relogio.remote.tries', '0');
    setTimeout(()=>location.replace('index.html'), 3000); /* volta pela porta de entrada, que abre a versão baixada */
  }catch(e){}
}
if(IS_NATIVE){ setTimeout(checkUpdate, 8000); setInterval(checkUpdate, 6*3600*1000); }
</script>
